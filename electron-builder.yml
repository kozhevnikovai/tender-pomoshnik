appId: ai.kozhevnikov.tender-pomoshnik
productName: Тендерный помощник
executableName: TenderPomoshnik
copyright: © 2026 Egor Kozhevnikov · MIT
artifactName: TenderPomoshnik-${version}-${os}-${arch}.${ext}
extraMetadata:
  main: app/main.mjs
directories:
  output: release
  buildResources: app/build
npmRebuild: false
files:
  - dist/**
  - rules/**
  - app/**
  - "!app/build/**"
  - package.json
  - "!**/*.map"
  - "!node_modules/@node-llama-cpp/*cuda*/**"
asarUnpack:
  - node_modules/@napi-rs/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@node-llama-cpp/**
  - node_modules/node-llama-cpp/**
win:
  target: [{ target: nsis, arch: [x64] }]
  icon: app/build/icon.png
  files:
    - "!node_modules/@node-llama-cpp/mac-*/**"
    - "!node_modules/@node-llama-cpp/linux-*/**"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Тендерный помощник
  language: "1049"
mac:
  target: [{ target: dmg, arch: [arm64, x64] }]
  icon: app/build/icon.png
  category: public.app-category.business
  identity: null
  hardenedRuntime: false
  files:
    - "!node_modules/@node-llama-cpp/win-*/**"
    - "!node_modules/@node-llama-cpp/linux-*/**"
dmg:
  title: Тендерный помощник
